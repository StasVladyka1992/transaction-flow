syntax = "proto3";
//import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

package com.gamingtec.wallet;

message BalanceRequestGrpc {
  uint32 partyId = 1;
  uint32 brandId = 2;
  string gameId = 3;
  string platformCode = 4;
  string playerCurrency = 5;
  uint32 numDecimalParts = 6;
}

message BalanceGrpc{
  uint32 accountId = 1;
  uint32 partyId = 2;
  DecimalValue real = 3;
  DecimalValue releasedBonus = 4;
  DecimalValue playableBonus = 5;
}

message BetRequestGrpc{
  uint32 partyId = 1;
  uint32 accountId = 2;
  uint32 platformId = 3;
  string platformCode = 4;
  string gameId = 5;
  uint32 gameInfoId = 6;
  bool sportbook = 7;
  string playerCurrency = 8;
  string platformGameTranId = 9;
  string platformTranId = 10;
  DecimalValue amount = 11;
}

message BetResponseGrpc{
  BalanceGrpc balance = 1;
  uint64 transactionId = 2;
}

message DecimalValue {
  uint32 scale = 1;
  uint32 precision = 2;
  bytes value = 3;
}

message OptionalUInt64Value {
  google.protobuf.UInt64Value result = 1;
}

message OptionalUInt32Value {
  google.protobuf.UInt32Value result = 1;
}

message OptionalStringValue{
  google.protobuf.StringValue result = 1;
}