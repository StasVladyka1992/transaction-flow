spring:
  kafka:
    bootstrap-servers: localhost:9095
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

camel:
  servlet:
    mapping:
      context-path: /api/*

logging:
  config: classpath:log4j2.xml
  level:
    io.swagger: DEBUG
    com.gamingtec.services: INFO
    org.apache.camel: INFO